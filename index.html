<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <h1>Snake</h1>

    <div class="scoreboard">
      <div class="score-box">
        <span class="label">Score</span>
        <span id="score">0</span>
      </div>
      <div class="score-box">
        <span class="label">Best</span>
        <span id="highScore">0</span>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlayTitle">Snake</h2>
        <p id="overlayText">Press an arrow key or tap Start to play</p>
        <button id="startBtn">Start Game</button>
      </div>
    </div>

    <p class="instructions">Use Arrow Keys / WASD to move. Press Space to pause.</p>

    <!-- Mobile controls -->
    <div class="controls">
      <button class="ctrl-btn" id="upBtn">▲</button>
      <div class="ctrl-row">
        <button class="ctrl-btn" id="leftBtn">◀</button>
        <button class="ctrl-btn" id="downBtn">▼</button>
        <button class="ctrl-btn" id="rightBtn">▶</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
